services:
  app:
    build: .
    image: voting-app:latest
    restart: unless-stopped

    # --- resource limits: a loop, a leak or an attack cannot take the whole server -------------
    deploy:
      resources:
        limits:
          cpus: "1.0"          # at most one CPU core
          memory: 512M         # hard memory cap; the container is restarted if it goes over
        reservations:
          memory: 128M
    memswap_limit: 512M        # no swap beyond the memory cap
    pids_limit: 200            # stops fork bombs and runaway thread creation
    ulimits:
      nofile:                  # open files / sockets
        soft: 4096
        hard: 4096
    security_opt:
      - no-new-privileges:true # the process cannot gain privileges
    cap_drop:
      - ALL                    # no extra Linux capabilities (the app listens on port 8000)
    logging:                   # keep the logs from filling the disk
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      - DATABASE_URL=sqlite:////data/voting.db
      - DATA_DIR=/data
      # Values are read from .env on the host (docker compose substitutes them here).
      - SECRET_KEY=${SECRET_KEY:-change-me-please-super-secret}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_RESET_PASSWORD=${ADMIN_RESET_PASSWORD:-false}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - LINK_GRACE_DAYS=${LINK_GRACE_DAYS:-30}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-true}
    volumes:
      - voting_data:/data
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  voting_data:
